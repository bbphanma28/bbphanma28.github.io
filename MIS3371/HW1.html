<!DOCTYPE HTML>
<!-- Without CSS -->
<html>
  <head>
    <title>BB28 Medical Form</title>
    <link rel="stylesheet" href="HW1.css">
  </head>
 
    <!-- Start of Body -->
    <body>
      
      <!-- Header -->
      <div id="header">
        <table width = 100%>
          <tr>
            <td valign="top">BB28 Medical</td>
            <td valign="bottom" align="right">Today's date: <span id="today">Date goes here </span></td>
          </tr>
        </table>
      </div>

      <!-- Form Header -->
        <div>
          <table class="formheader">
            <tr>
              <th>Patient Registration Form</th>
            </tr>
          </table>
        </div>
        
        <!-- Form Start -->
      <div class="form-container">
        <form action="homework1-thanks.html">
          <div class="patient-header">Patient Information</div>
          <!-- Enter Name -->
          <div class="text-boxes">
            <table>
              <tr>
                <td>
                  <label for="firstname">First Name</label>
                  <input type="text" id="fname" name="firstname">
                </td>
                <td>
                  <label for="lastname">Last Name</label>
                  <input type="text" id="lname" name="lastname">
                </td>
                <td>
                  <label for="middleinitial">Middle Initial</label>
                  <input type="text" id="middleinit" name="middleinit">
                </td>
              </tr>
          </table>
          <!-- Enter DOB, SSN, and Email -->
          <table>
             <tr>
                <td>
                  <label for= "birthday">DOB</label>
                  <input type="date" id="birthday" name="birthday">
                </td>
                <td>
                  <label for="SSN">SSN</label>
                  <input type="number" id="SSN" name="SSN" size="9" maxlength="9">
                </td>
                <td>
                  <label for="email">Email Address</label>
                  <input type="text" id="email" name="email">
                </td>
              </tr>
          </table>
          <!-- Enter City, State, and ZIP -->
          <table>
            <tr>
              <td>
                <label for="city">City</label>
                <input type="text" id="city" name="city">
              </td>
              <td>
                <label for="state">State</label>
                <select required>
                <option value=""></option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="DC">District Of Columbia</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
            </select>
              </td>
              <td>
                <label for="zip">Zip Code</label>
                <input type="text"  pattern="[0-9]{5}" size="5" maxlength="5" id="zip" name="zip" required>
              </td>
            </tr>
          </table>
          <!-- Addresses -->
          <table>
              <tr>
                <td>
                  <label for="address1">Address 1</label>
                  <input type="text" id="address1" name="address1">
                </td>
              </tr>
              <tr>
                <td>
                  <label for="address2">Address 2</label>
                  <input type="text" id="address2" name="address2">
                </td>
              </tr>
          </table>
          </div>
          <!-- Checkboxes, Radio, and Slider -->
          <div class="second-part">
        	<table>
            <tr>
            <th colspan="3">What is your preferred language(s)?</th>
            </tr>
            <tr>
              <td>
                <input type="checkbox" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="checkbox" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="checkbox" name="english" value="English">
                <label for="language1">English</label>
              <td>
                <input type="checkbox" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="checkbox" name="english" value="English">
                <label for="language1">English</label>
              </td>
            </tr>
          </table>
          <table class="languages">
            <th colspan ="3">What is your preferred language(s)?</th>
            <tr>
              <td>
                <input type="radio" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="radio" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="radio" name="english" value="English">
                <label for="language1">English</label>
                <td>
                <input type="radio" name="english" value="English">
                <label for="language1">English</label>
              </td>
              <td>
                <input type="radio" name="english" value="English">
                <label for="language1">English</label>
              </td>
            </tr>
          </table>
          <table class="languages">
            <th colspan ="3">What is your preferred language(s)?</th>
              <tr>
                <td>
                  <input type="range" name="english" value="English">
                </td>
              </tr>
           </table>
           </div>
           <!-- Comment Box -->
          <table>
            <th colspan="3">Any concerns</th>
              <td>
                <label for="comments"></label>
                <input type="text" id="comment" name="comment">
              <td>
          </table>
          <table>
            <th colspan="3">Create Username and Password</th><br>
              <tr>
                <td>
                  <label for="user">Username</label>
                  <input type="text" id="user" name="user">
                </td>
              </tr>
              <tr>
                <td>
                  <label for="pass">Password</label>
                  <input for="password" id="pass" name="pass">
                </td>
              </tr>
          </table>  
          
          <input type="submit">
          <input type="reset">
    </form>
     <script>
    document.getElementById("today").innerHTML = new Date().toLocaleDateString();
    </script>
    </body>
</html>
